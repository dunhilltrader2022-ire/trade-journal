<title>Master Bitfunded (sample)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Dark only, colours sampled from bitfunded.com: near-black page, navy panels, blue accent, Poppins and Inter.
   Calm palette, no green. Gains = soft teal, losses = plain text, caution = amber, alerts and warnings = red.
   Chart: gold candles up, black candles down with a light edge so they show on navy.
   Layout: instrument-panel cockpit — sticky top bar, one working column of panels, dense tables in their own scroll boxes. */
:root {
  --bg: #060606; --panel: #0B1C44; --panel-2: #0D2652; --line: #28334C; --fg: #F2F5FA; --muted: #A9B4C6;
  --accent: #1890FF; --accent-fg: #04122B;
  --good: #72C0CF; --warn: #E0A75E; --danger: #F0827C;
  --candle-up: #D4B254; --candle-down: #0B0D10; --candle-down-edge: #8A97AB;
  --font-display: "Poppins", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
h1 { font-size: 26px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
a { color: var(--accent); }
.num, .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.label { font-family: var(--font-display); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-inner { max-width: 1440px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: 0.02em; }
.brand svg { color: var(--accent); }
.env-tag { font-family: var(--font-data); font-size: 11px; padding: 2px 6px; border-radius: 4px; border: 1px dashed var(--warn); color: var(--warn); }
nav.tabs { display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 auto; }
nav.tabs a { padding: 8px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; min-height: 40px; display: inline-flex; align-items: center; }
nav.tabs a[aria-current="page"] { background: var(--panel-2); color: var(--fg); }
nav.tabs a:hover { color: var(--fg); }
.acct-pick { display: flex; align-items: center; gap: 8px; }
.mini-clock { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.mini-clock b { color: var(--fg); font-weight: 600; }

main { max-width: 1440px; margin: 0 auto; padding-block: 18px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; overflow: clip; }
.panel-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-h .grow { flex: 1 1 auto; }
.panel-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; }
.row > .wide { flex: 999 1 620px; min-width: 0; }
.row > .side { flex: 1 1 340px; min-width: 0; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.inline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.warn { background: color-mix(in srgb, var(--warn) 16%, var(--panel)); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.btn.danger { background: color-mix(in srgb, var(--danger) 16%, var(--panel)); border-color: color-mix(in srgb, var(--danger) 55%, var(--line)); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; min-height: 36px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; min-height: 36px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 16%, transparent); font-weight: 600; }
.chip.over[aria-pressed="true"] { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 16%, transparent); }
.chip.over { color: color-mix(in srgb, var(--danger) 70%, var(--muted)); }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); flex: 1 1 130px; min-width: 0; }
input[type=text], input[type=number], input:not([type]), select, textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-height: 42px; width: 100%; color: var(--fg); }
textarea { min-height: 72px; resize: vertical; }
.check { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 7px; border-radius: 5px; white-space: nowrap;
  background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--fg); }
.tag.good { background: color-mix(in srgb, var(--good) 20%, transparent); color: color-mix(in srgb, var(--good) 75%, var(--fg)); }
.tag.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: color-mix(in srgb, var(--warn) 75%, var(--fg)); }
.tag.danger, .tag.breach { background: color-mix(in srgb, var(--danger) 20%, transparent); color: color-mix(in srgb, var(--danger) 75%, var(--fg)); }
.tag.accent { background: color-mix(in srgb, var(--accent) 20%, transparent); color: color-mix(in srgb, var(--accent) 75%, var(--fg)); }
.tag.live { background: color-mix(in srgb, var(--good) 20%, transparent); color: color-mix(in srgb, var(--good) 75%, var(--fg)); }
.tag.demo { background: color-mix(in srgb, var(--accent) 20%, transparent); color: color-mix(in srgb, var(--accent) 75%, var(--fg)); }
.c-good { color: var(--good); } .c-loss { color: var(--fg); } .c-warn { color: var(--warn); } .c-danger, .c-breach { color: var(--danger); } .c-ok { color: var(--fg); }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; border-radius: var(--r); border: 1px solid var(--line); }
.banner.warn { background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.banner.danger, .banner.breach { background: color-mix(in srgb, var(--danger) 12%, var(--panel)); border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); }
.banner.info { background: color-mix(in srgb, var(--accent) 10%, var(--panel)); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }

/* Risk strip: the room left today is the one number that matters most */
.risk-strip { display: flex; flex-wrap: wrap; gap: 12px; }
.risk-strip .gauge { flex: 1 1 210px; padding: 18px 20px; border-radius: 12px; }
.risk-strip .gauge.hero { flex: 2 1 380px; background: var(--panel); }
.gauge .tile-h { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-weight: 500; }
.gauge .tile-h h2 { font: inherit; letter-spacing: 0; }
.gauge .note { color: var(--muted); font-size: 13px; }
.gauge.hero .room { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.gauge.hero .room .v { font-size: 52px; line-height: 1; letter-spacing: -0.02em; }
.gauge.hero .room strong { color: var(--fg); font-weight: 600; }
.gauge .big { font-family: var(--font-data); font-size: 30px; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
.gauge.late { border-color: color-mix(in srgb, var(--danger) 60%, var(--line)); }
.gauge.late .big { color: var(--danger); }
.rules-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; margin-top: -4px; }
.phone-only { display: none; }
.bar.ok > i { background: var(--good); }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
.bar.warn > i { background: var(--warn); } .bar.danger > i, .bar.breach > i { background: var(--danger); } .bar.good > i { background: var(--good); }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--panel); }

/* Gauges */
.gauge { padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.gauge .v { font-family: var(--font-data); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.gauge .v small { font-size: 13px; font-weight: 400; color: var(--muted); }
.gauge.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.gauge.danger, .gauge.breach { border-color: color-mix(in srgb, var(--danger) 60%, var(--line)); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.dash-main, .dash-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 1000px) {
  .dash-grid { display: flex; flex-direction: column; align-items: stretch; }
  .dash-main, .dash-side { display: contents; }
  #dbChartPanel { order: 1; } #dbTicket { order: 2; } #dbPosPanel { order: 3; } #dbFeedPanel { order: 4; } #phoneNew { order: 5; }
}

/* Tables */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 8px 10px; white-space: nowrap; }
td { padding: 10px; border-top: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }

.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px; }
.shot-list { display: flex; flex-direction: column; gap: 10px; }
.shot { display: flex; flex-direction: column; gap: 6px; }
.shot img { display: block; width: 100%; max-height: 320px; object-fit: contain; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.feed { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
.feed li { display: flex; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); }
.feed li:first-child { border-top: 0; }

#chart { height: 420px; position: relative; }
.chart-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; }
.chart-sym { width: auto; min-height: 40px; font-family: var(--font-display); font-weight: 600; font-size: 16px; background: transparent; border-color: transparent; padding-left: 4px; }
.chart-sym:hover { border-color: var(--line); }
.chart-sym option { background: var(--panel); font: 14px var(--font-body); }
.chart-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
.chart-tools .seg { border: 0; gap: 2px; }
.chart-tools .seg button { min-width: 40px; min-height: 36px; padding: 4px 8px; border-radius: 6px; font: 500 13px var(--font-data); }
.chart-tools .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); font-weight: 600; }
.chart-tools .tool-btns button svg { display: block; margin: 0 auto; }
.chart-tools .tool-btns button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.chart-wrap { position: relative; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 35%, var(--panel)); }
.chart-hint { position: absolute; left: 12px; top: 8px; right: 92px; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.chart-hint > * { pointer-events: auto; }
.chart-hint .small { background: var(--panel); padding: 4px 8px; border-radius: 6px; }
.chart-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-top: 1px solid var(--line); }
.pos-table td.num { white-space: nowrap; }
.pos-table td.pos-name .sub { color: var(--muted); }
.pos-table td.pos-name .tag { margin-top: 4px; white-space: normal; }
.pos-table td.pos-act .btn { min-height: 36px; }
.side-toggle { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.side-toggle button { min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-weight: 600; cursor: pointer; }
.side-toggle button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; }
.tk-grid .tk-wide { grid-column: 1 / -1; }
.tk-sum { background: var(--panel-2); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.tk-sum .tk-row { display: flex; justify-content: space-between; gap: 12px; }
.tk-sum .tk-row > span:first-child { color: var(--muted); }
.tk-sum .tk-row > span:last-child { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; }
.tk-submit { min-height: 48px; width: 100%; font-size: 15px; }
.tk-more-btn { background: transparent; border: 0; min-height: 44px; color: var(--muted); font-weight: 500; cursor: pointer; font-size: 13px; }
.tk-more-btn:hover { color: var(--fg); }
.dot { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--accent); }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.danger { background: var(--danger); }
.feed .feed-time { flex: none; color: var(--muted); font-size: 12px; font-family: var(--font-data); white-space: nowrap; }
.tabs-more { position: relative; }
.tabs-more summary { list-style: none; padding: 8px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.tabs-more summary::-webkit-details-marker { display: none; }
.tabs-more summary:hover, .tabs-more.on summary { color: var(--fg); }
.tabs-more.on summary { background: var(--panel-2); }
.tabs-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 8; min-width: 200px; display: flex; flex-direction: column; gap: 2px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.4); }
nav.tabs .tabs-menu a { display: flex; }
.live-status { font-family: var(--font-data); font-size: 12px; color: var(--muted); white-space: nowrap; }
.live-status.bad { color: var(--danger); }
#chart.armed, #chart.picked { touch-action: none; }
#chart.armed * { cursor: crosshair !important; }
#chart.over * { cursor: move !important; }
.chart-fallback { padding: 24px; }

.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.checks li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--good); }
.checks li.warn::before { background: var(--warn); } .checks li.danger::before, .checks li.breach::before { background: var(--danger); }

.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kv > div { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.kv .k { font-size: 12px; color: var(--muted); }
.kv .v { font-family: var(--font-data); font-size: 16px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.rubric { display: grid; grid-template-columns: minmax(120px, 190px) 1fr 34px; gap: 4px 12px; align-items: center; }
.rubric .cite { grid-column: 2 / 4; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.grade { font-family: var(--font-display); font-size: 46px; font-weight: 700; line-height: 1; }
.review-text { white-space: pre-wrap; line-height: 1.55; }
.ai-box { border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: var(--r); }

.toast-wrap { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left-width: 1px; border-radius: 10px; padding: 10px 14px; box-shadow: 0 6px 20px rgb(0 0 0 / 0.12); display: flex; gap: 10px; align-items: flex-start; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.row-menu { width: auto; min-height: 32px; padding: 4px 8px; font-size: 13px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--warn) 12%, var(--panel)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.chat { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; }
.chat .msg { padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; line-height: 1.5; }
.chat .me { background: var(--panel-2); align-self: flex-end; max-width: 85%; }
.chat .ai { border: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 700px) {
  .topbar { position: static; }
  .topbar-inner { flex-wrap: nowrap; justify-content: space-between; }
  .brand-name, .live-status, .mini-clock { display: none; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.tabs > a, nav.tabs > button, .tabs-more summary { min-height: 56px; display: flex; align-items: center; justify-content: center; padding: 0 4px; border: 0; border-radius: 0; background: transparent; color: var(--muted); font: 500 14px var(--font-body); text-decoration: none; white-space: nowrap; width: 100%; }
  nav.tabs > a[aria-current="page"], nav.tabs > button[aria-current="page"], .tabs-more.on summary { background: transparent; color: var(--fg); font-weight: 600; }
  .tabs-menu { top: auto; bottom: calc(100% + 6px); left: auto; right: 8px; }
  nav.tabs .tabs-menu a { min-height: 44px; }
  .desk-only { display: none !important; }
  .phone-only { display: revert; }
  nav.tabs > .phone-only { display: flex; }
  .tabs-menu a.phone-only { display: flex; }
  main { padding-left: 12px; padding-right: 12px; padding-block: 12px 88px; gap: 12px; }
  .toast-wrap { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  .acct-pick { flex: 0 1 auto; min-width: 0; }
  .acct-pick select { min-width: 0; max-width: 62vw; }

  .risk-strip .gauge { flex: 1 1 calc(50% - 6px); min-width: 0; padding: 14px; }
  .risk-strip .gauge.hero { flex: 1 1 100%; padding: 16px; }
  .gauge.hero .room { flex-direction: column; gap: 10px; }
  .gauge.hero .room .v { font-size: 56px; }
  .gauge .big { font-size: 24px; }
  .gauge .note.desk-note { display: none; }
  #dbClockWrap, .rules-line { display: none; }
  #phoneNew { display: block; min-height: 52px; width: 100%; font-size: 15px; }

  body[data-pv="home"] #dbChartPanel, body[data-pv="home"] #dbTicket,
  body[data-pv="chart"] .risk-strip, body[data-pv="chart"] #dbTicket, body[data-pv="chart"] #dbPosPanel, body[data-pv="chart"] #dbFeedPanel, body[data-pv="chart"] #phoneNew,
  body[data-pv="trade"] .risk-strip, body[data-pv="trade"] #dbChartPanel, body[data-pv="trade"] #dbPosPanel, body[data-pv="trade"] #dbFeedPanel, body[data-pv="trade"] #phoneNew { display: none; }

<script>

(function (root) {

    GMX: 26, PENDLE: 4.5, RUNE: 4.8, KAS: 0.16, STX: 1.9, ORDI: 38, BONK: 0.000025, FLOKI: 0.00018, POPCAT: 0.9, BOME: 0.009,
    NOT: 0.016, TRUMP: 12, JTO: 2.8, W: 0.35, ZRO: 3.6, BLUR: 0.27, GRT: 0.21, THETA: 1.6, KAVA: 0.45, ROSE: 0.08,
    MINA: 0.6, XMR: 165, EOS: 0.65, NEO: 11, IOTA: 0.2, QNT: 70, CHZ: 0.08, APE: 1.1, '1INCH': 0.36, ENS: 21,
    CAKE: 2.3, SUSHI: 0.9, ZK: 0.17, AR: 28, BERA: 5.5, VIRTUAL: 1.6, FARTCOIN: 1.1, PENGU: 0.012, MOVE: 0.45, S: 0.55,

  };
  var MEMES = ['DOGE', 'PEPE', 'WIF', 'SHIB', 'BONK', 'FLOKI', 'POPCAT', 'BOME', 'TRUMP', 'FARTCOIN', 'PENGU', 'MEME', 'PEOPLE', 'NOT'];
  function classify(base) { return MAJORS.indexOf(base) >= 0 ? 'major' : TRADITIONAL[base] ? 'traditional' : 'minor'; }
  function decimalsFor(p) { return p >= 1000 ? 1 : p >= 10 ? 2 : p >= 1 ? 3 : p >= 0.01 ? 4 : p >= 0.0001 ? 6 : 8; }
  var ASSETS = {};
  Object.keys(CRYPTO_BASE).forEach(function (b) {
    var cls = classify(b), meme = MEMES.indexOf(b) >= 0;
    ASSETS[b + '/USDT'] = { base: b, cls: cls, unit: b, start: CRYPTO_BASE[b], decimals: decimalsFor(CRYPTO_BASE[b]), vol: meme ? 0.002 : cls === 'major' ? 0.0008 : 0.0014 };
  });
  Object.keys(TRADITIONAL).forEach(function (b) {
    var t = TRADITIONAL[b];
    ASSETS[b + '/' + t.quote] = { base: b, cls: 'traditional', unit: t.unit, start: t.base, decimals: b === 'XAG' ? 3 : 2, vol: b === 'TSLA' ? 0.0007 : 0.0003 };
  });
  /* Turn what a platform shows ("BTCUSDT", "btc-usdt", "BTC/USDT", "BTC", "XAUUSD") into our symbol. */
  function parseSymbol(raw) {
    var t = String(raw || '').trim().toUpperCase().replace(/\s+/g, '').replace(/[-_:]/g, '/').replace(/\.P$|PERP$|\/PERP$/, '');
    if (!t) return null;
    var base, quote;
    if (t.indexOf('/') > 0) { var parts = t.split('/'); base = parts[0]; quote = parts[1] || ''; }
    else {
      var m = t.match(/^(.+?)(USDT|USDC|USD)$/);
      if (m && m[1]) { base = m[1]; quote = m[2]; } else { base = t; quote = ''; }
    }
    if (!/^[A-Z0-9]{1,15}$/.test(base)) return null;
    if (TRADITIONAL[base]) return base + '/USD';
    return base + '/' + (quote === 'USDC' ? 'USDC' : 'USDT');
  }
  /* Register a pair that isn't in the built-in list (a coin from the user's Bitfunded list). */
  function addPair(sym, start) {
    if (ASSETS[sym]) { if (start > 0) { ASSETS[sym].start = start; ASSETS[sym].decimals = decimalsFor(start); } return ASSETS[sym]; }
    var base = sym.split('/')[0], cls = classify(base), p = start > 0 ? start : 1;
    ASSETS[sym] = { base: base, cls: cls, unit: base, start: p, decimals: decimalsFor(p), vol: MEMES.indexOf(base) >= 0 ? 0.002 : cls === 'major' ? 0.0008 : 0.0014, custom: true, priceGuessed: !(start > 0) };
    return ASSETS[sym];
  }
  function assetInfo(sym) {
    if (ASSETS[sym]) return ASSETS[sym];
    var base = String(sym).split('/')[0].toUpperCase();
    return { base: base, cls: classify(base), unit: base, start: 1, decimals: 4, vol: 0.0014 };
  }
  var CLASS_LABEL = { major: 'Major crypto · 10-day hold', minor: 'Minor crypto · 7-day hold', traditional: 'Gold, silver, TSLA · 5-day hold' };

  function rulesFor(acc) {
    var p = PROGRAMS[acc.program] || PROGRAMS['2-Step'];
    var s = p.stages[acc.stage] || p.stages['Stage 1'];
    return {
      version: acc.rulesVersion || p.version,
      dailyLossPct: s.dailyLossPct, maxLossPct: s.maxLossPct, targetPct: s.targetPct,
      maxPositions: p.maxPositions, maxExposurePct: p.maxExposurePct,
      maxLeverage: acc.maxLeverage || p.maxLeverage,
      minHoldMin: p.minHoldMin, minClosedTrades: p.minClosedTrades,
      holdCapDays: p.holdCapDays, reset: p.reset, dailyLossMode: p.dailyLossMode
    };
  }

  function accountType(acc) {
    if (acc.paper) return 'Paper';
    var p = PROGRAMS[acc.program] || PROGRAMS['2-Step'];
    var s = p.stages[acc.stage] || p.stages['Stage 1'];
    return s.type;
  }

  /* The Bitfunded day. Nominal reset is 00:00 at UTC+8; settlement can land up to
   * settleMin later, so the app keeps the old day until the settlement window closes. */
  function dayBounds(now, reset) {
    reset = reset || PROGRAMS['2-Step'].reset;
    var off = reset.utcOffsetHours * HOUR, settle = reset.settleMin * MIN;
    var start = Math.floor((now - settle + off) / DAY) * DAY - off + settle;
    return {
      start: start,
      end: start + DAY,
      nominalReset: start + DAY - settle,
      settleEnd: start + DAY,
      inSettlement: now >= start + DAY - settle - 0 && now < start + DAY ? true : false
    };
  }

  function dir(t) { return t.side === 'Short' ? -1 : 1; }

  function summarize(trade) {
    var size = 0, notional = 0, margin = 0, maxLev = 0;
    (trade.fills || []).forEach(function (f) {
      size += f.size; notional += f.price * f.size; margin += f.price * f.size / f.lev;
      if (f.lev > maxLev) maxLev = f.lev;
    });
    var avg = size ? notional / size : 0;
    return {
      size: size, avgEntry: avg, notional: notional, margin: margin,
      effLeverage: margin ? notional / margin : 0, maxFillLeverage: maxLev,
      openedAt: trade.fills && trade.fills.length ? trade.fills[0].t : null
    };
  }

  function pnlAt(trade, price) {
    var s = summarize(trade);
    return dir(trade) * (price - s.avgEntry) * s.size - (trade.fees || 0);
  }

  function realized(trade) {
    if (!trade.exit) return 0;
    return pnlAt(trade, trade.exit.price);
  }

  /* Loss if the stop is hit, as a positive number. null when there is no stop. */
  function riskToStop(trade) {
    if (trade.sl == null || trade.sl === '') return null;
    var s = summarize(trade);
    return dir(trade) * (s.avgEntry - trade.sl) * s.size + (trade.fees || 0);
  }

  function rMultiple(trade) {
    var first = { side: trade.side, sl: trade.sl, fills: (trade.fills || []).slice(0, 1), fees: 0 };
    var r = riskToStop(first);
    if (!r || r <= 0 || !trade.exit) return null;
    return realized(trade) / r;
  }

  function level(ratio) {
    if (ratio >= 1) return 'breach';
    if (ratio >= 0.9) return 'danger';
    if (ratio >= 0.6) return 'warn';
    return 'ok';
  }

  function accountMetrics(acc, trades, prices, now) {
    var cfg = rulesFor(acc);
    var mine = trades.filter(function (t) { return t.accountId === acc.id; });
    var open = mine.filter(function (t) { return t.status === 'open'; });
    var closed = mine.filter(function (t) { return t.status === 'closed'; });
    var day = dayBounds(now, cfg.reset);

    var stageStart = acc.stageStartedAt || acc.startedAt || 0;
    /* Balance for the current stage: what Bitfunded showed when tracking began (priorPnl),
     * plus trades closed in this stage. A new stage starts from the account size again. */
    var realizedAll = Number(acc.priorPnl) || 0, realizedLossToday = 0, realizedNetToday = 0;
    var pdl = acc.priorDayLoss;
    if (pdl && pdl.day === day.start && pdl.amount > 0) { realizedLossToday += Number(pdl.amount); realizedNetToday -= Number(pdl.amount); }
    closed.forEach(function (t) {
      var r = realized(t);
      if (t.exit.t >= stageStart) realizedAll += r;
      if (t.exit.t >= day.start && t.exit.t < day.end) {
        realizedNetToday += r;
        if (r < 0) realizedLossToday += -r;
      }
    });
    var unrealized = 0, floatingLoss = 0, margin = 0, openRisks = [];
    open.forEach(function (t) {
      var px = prices[t.symbol];
      var u = px == null ? 0 : pnlAt(t, px);
      unrealized += u;
      if (u < 0) floatingLoss += -u;
      margin += summarize(t).margin;
      var hasStop = Number(t.sl) > 0;
      openRisks.push({ id: t.id, hasStop: hasStop, atStop: hasStop ? pnlAt(t, Number(t.sl)) : u });
    });

    var size = acc.size;
    var equity = size + realizedAll + unrealized;
    var realizedPart = cfg.dailyLossMode === 'net' ? Math.max(0, -realizedNetToday) : realizedLossToday;
    var dailyLoss = realizedPart + floatingLoss;
    var dailyLossPct = dailyLoss / size * 100;
    var totalLossPct = Math.max(0, (size - equity) / size * 100);
    var profitPct = (equity - size) / size * 100;
    var exposurePct = equity > 0 ? margin / equity * 100 : 100;
    var qualifying = (Number(acc.priorQualifying) || 0) + closed.filter(function (t) {
      var o = summarize(t).openedAt;
      return o >= stageStart && t.exit.t - o >= cfg.minHoldMin * MIN;
    }).length;

    var gauges = [
      { key: 'daily', label: 'Daily loss', value: dailyLossPct, limit: cfg.dailyLossPct, unit: '%', ratio: dailyLossPct / cfg.dailyLossPct },
      { key: 'total', label: 'Total loss', value: totalLossPct, limit: cfg.maxLossPct, unit: '%', ratio: totalLossPct / cfg.maxLossPct },
      { key: 'positions', label: 'Open positions', value: open.length, limit: cfg.maxPositions, unit: '', ratio: open.length / cfg.maxPositions },
      { key: 'exposure', label: 'Margin exposure', value: exposurePct, limit: cfg.maxExposurePct, unit: '%', ratio: exposurePct / cfg.maxExposurePct }
    ];
    gauges.forEach(function (g) { g.level = level(g.ratio); });
    // Positions: being AT the cap is allowed; only exceeding it is a breach.
    var pg = gauges[2];
    pg.level = open.length > cfg.maxPositions ? 'breach' : open.length === cfg.maxPositions ? 'danger' : pg.ratio >= 0.6 ? 'warn' : 'ok';

    return {
      cfg: cfg, day: day, equity: equity, realizedAll: realizedAll, unrealized: unrealized,
      realizedPart: realizedPart, openRisks: openRisks, dailyLoss: dailyLoss, dailyLossPct: dailyLossPct, dailyRoom: cfg.dailyLossPct / 100 * size - dailyLoss,
      totalLossPct: totalLossPct, totalRoom: equity - size * (1 - cfg.maxLossPct / 100), profitPct: profitPct, targetPct: cfg.targetPct,
      openCount: open.length, margin: margin, exposurePct: exposurePct,
      qualifyingClosed: qualifying, gauges: gauges,
      breached: gauges.some(function (g) { return g.level === 'breach'; })
    };
  }

  function positionFlags(trade, acc, now) {
    var cfg = rulesFor(acc);
    var s = summarize(trade);
    var flags = [];
    if (trade.sl == null || trade.sl === '') flags.push({ code: 'no_sl', level: 'danger', text: 'No stop loss' });
    if (trade.tp == null || trade.tp === '') flags.push({ code: 'no_tp', level: 'warn', text: 'No take profit' });
    if (s.maxFillLeverage > cfg.maxLeverage) flags.push({ code: 'leverage', level: 'danger', text: 'Leverage above 1:' + cfg.maxLeverage });
    var cls = assetInfo(trade.symbol).cls;
    var cap = cfg.holdCapDays[cls] * DAY;
    var held = now - s.openedAt;
    var holdLeft = cap - held;
    if (trade.status === 'open') {
      if (holdLeft <= 0) flags.push({ code: 'hold_over', level: 'breach', text: 'Hold limit passed' });
      else if (holdLeft < DAY) flags.push({ code: 'hold_soon', level: 'warn', text: 'Hold limit within 24h' });
      if (held < cfg.minHoldMin * MIN) flags.push({ code: 'min_hold', level: 'warn', text: 'Under 10 min: closing now won’t count for payout' });
    }
    var runSize = 0, runNotional = 0;
    (trade.fills || []).forEach(function (f, i) {
      if (i > 0) {
        var avg = runNotional / runSize;
        if (dir(trade) * (f.price - avg) < 0) flags.push({ code: 'avg_down', level: 'warn', text: 'Fill ' + (i + 1) + ' averaged down' });
      }
      runSize += f.size; runNotional += f.price * f.size;
    });
    return { flags: flags, holdLeftMs: holdLeft, heldMs: held, holdCapMs: cap };
  }

  /* Rules that apply across all your real (Demo and Live) accounts. */
  function crossAccount(accounts, trades, now) {
    var real = accounts.filter(function (a) { return !a.paper && a.status === 'active'; });
    var ids = {}; real.forEach(function (a) { ids[a.id] = a; });
    var open = trades.filter(function (t) { return t.status === 'open' && ids[t.accountId]; });

    var hedges = [];
    var bySym = {};
    open.forEach(function (t) { (bySym[t.symbol] = bySym[t.symbol] || []).push(t); });
    Object.keys(bySym).forEach(function (sym) {
      var ts = bySym[sym];
      ts.forEach(function (a, i) {
        ts.slice(i + 1).forEach(function (b) {
          if (a.side !== b.side && a.accountId !== b.accountId) hedges.push({ symbol: sym, a: a.id, b: b.id, accounts: [a.accountId, b.accountId] });
        });
      });
    });

    var coordinated = [];
    var recent = trades.filter(function (t) { return ids[t.accountId] && t.fills && t.fills.length && now - t.fills[0].t < DAY; });
    recent.forEach(function (a, i) {
      recent.slice(i + 1).forEach(function (b) {
        if (a.symbol === b.symbol && a.accountId !== b.accountId && Math.abs(a.fills[0].t - b.fills[0].t) <= 2 * MIN) {
          coordinated.push({ symbol: a.symbol, a: a.id, b: b.id, accounts: [a.accountId, b.accountId] });
        }
      });
    });

    var levels = {}, dupes = [];
    real.forEach(function (a) {
      var k = a.program + '|' + a.size;
      if (levels[k]) dupes.push(k); else levels[k] = true;
    });

    var cap = PROGRAMS['2-Step'].maxPositions;
    return {
      hedges: hedges, coordinated: coordinated, duplicateLevels: dupes,
      totalOpen: open.length, positionCap: cap,
      positionLevel: open.length > cap ? 'breach' : open.length === cap ? 'danger' : open.length / cap >= 0.6 ? 'warn' : 'ok'
    };
  }

  /* Bitfunded balance (closed P/L only) -> the opening P/L the cockpit should assume for this stage,
   * so tracked trades plus that baseline add up to the balance Bitfunded shows. */
  function baselineFromBalance(acc, trades, balance) {
    var stageStart = acc.stageStartedAt || acc.startedAt || 0, tracked = 0;
    trades.forEach(function (t) { if (t.accountId === acc.id && t.status === 'closed' && t.exit.t >= stageStart) tracked += realized(t); });
    return { priorPnl: Number(balance) - acc.size - tracked, tracked: tracked };
  }
  function canAddChallenge(accounts, draft) {
    if (draft.paper) return { ok: true };
    var clash = accounts.filter(function (a) {
      return !a.paper && a.status === 'active' && a.program === draft.program && Number(a.size) === Number(draft.size);
    });
    return clash.length ? { ok: false, reason: 'You already have an active ' + draft.program + ' ' + fmtSize(draft.size) + ' challenge (' + clash[0].name + '). Bitfunded allows one active challenge per level.' } : { ok: true };
  }

  function fmtSize(n) { return n >= 1000 ? (n / 1000) + 'K' : String(n); }

  /* Pre-trade check for a new position or an add. */
  function preTrade(acc, metrics, ticket, existing) {
    var cfg = rulesFor(acc);
    var checks = [];
    var fill = { t: ticket.t, price: Number(ticket.price), size: Number(ticket.size), lev: Number(ticket.lev) };
    var sim = existing
      ? Object.assign({}, existing, { fills: existing.fills.concat([fill]), sl: ticket.sl !== '' && ticket.sl != null ? Number(ticket.sl) : existing.sl })
      : { side: ticket.side, sl: ticket.sl === '' || ticket.sl == null ? null : Number(ticket.sl), tp: ticket.tp, fills: [fill], fees: 0 };
    var risk = riskToStop(sim);
    var currentRisk = existing ? (riskToStop(existing) || 0) : 0;

/* ---------- views: pairs ---------- */
function savePairs(p) { setMeta('settings', Object.assign({}, Store.meta.settings, { pairs: p })); }
function togglePair(sym, on) {
  var p = Object.assign({ custom: {} }, pairSettings() || {});
  var list = p.enabled ? p.enabled.slice() : allSyms();
  if (on && list.indexOf(sym) < 0) list.push(sym);
  if (!on) list = list.filter(function (x) { return x !== sym; });
  p.enabled = list; savePairs(p);
}
function parsePairText(text) {
  var out = [], bad = [];
  String(text || '').split(/[\n,;\t]+/).forEach(function (chunk) {
    var parts = chunk.trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return;
    var priceTok = parts.length > 1 && /^[0-9]*\.?[0-9]+(e-?\d+)?$/i.test(parts[parts.length - 1]) ? parts.pop() : null;
    var sym = R.parseSymbol(parts.join(''));
    if (!sym) { bad.push(chunk.trim()); return; }
    out.push({ sym: sym, price: priceTok ? Number(priceTok) : null });
  });
  return { pairs: out, bad: bad };
}
function importPairs(mode) {
  var el = document.getElementById('pairImport');
  var res = parsePairText(el ? el.value : '');
  if (!res.pairs.length) { ui.pairMsg = res.bad.length ? 'None of those looked like pairs: ' + res.bad.slice(0, 8).join(', ') : 'Paste at least one pair.'; return renderRoute(); }
  var p = Object.assign({ custom: {} }, pairSettings() || {});
  p.custom = Object.assign({}, p.custom || {});
  var fresh = 0, guessed = 0, seen = {};
  var syms = [];
  res.pairs.forEach(function (x) {
    if (seen[x.sym]) return; seen[x.sym] = true; syms.push(x.sym);
    var known = !!R.ASSETS[x.sym] && !R.ASSETS[x.sym].custom;
    if (!known) { fresh += 1; if (!(x.price > 0) && !(p.custom[x.sym] > 0)) guessed += 1; p.custom[x.sym] = x.price > 0 ? x.price : (p.custom[x.sym] || 0); R.addPair(x.sym, p.custom[x.sym]); }
    else if (x.price > 0) { p.custom[x.sym] = x.price; R.addPair(x.sym, x.price); Sim.prices[x.sym] = x.price; delete Sim.candles[x.sym]; }
    ensurePrice(x.sym);
  });
  var current = p.enabled ? p.enabled.slice() : allSyms();
  p.enabled = mode === 'add' ? current.concat(syms.filter(function (s) { return current.indexOf(s) < 0; })) : syms;
  var counts = { major: 0, minor: 0, traditional: 0 };
  syms.forEach(function (s) { counts[R.assetInfo(s).cls] += 1; });
  ui.pairMsg = (mode === 'add' ? 'Added ' : 'Your list is now ') + syms.length + ' pairs: ' + counts.major + ' major, ' + counts.minor + ' minor, ' + counts.traditional + ' traditional.' +
    (fresh ? ' ' + fresh + ' new to the cockpit' + (guessed ? ', ' + guessed + ' without a price (starting at 1.00 on the simulated feed; add a price after the symbol to fix it)' : '') + '.' : '') +
    (res.bad.length ? ' Skipped: ' + res.bad.slice(0, 8).join(', ') + (res.bad.length > 8 ? '…' : '') + '.' : '');
  if (el) el.value = '';
  savePairs(p);
}

<script>
/* Sample only: fills this browser with made-up data so the page can be explored without installing anything. */
(function () {
  var bar = document.createElement('div');
  bar.setAttribute('role', 'note');
  bar.style.cssText = 'background:#ffb020;color:#111;font:600 13px/1.4 Inter,system-ui,sans-serif;padding:8px 16px;text-align:center';
  bar.textContent = 'Sample only: made-up accounts and trades with live crypto prices from Binance (gold, silver and TSLA are simulated). Saved only in this browser. Nothing connects to Bitfunded or places trades.';
  document.body.insertBefore(bar, document.body.firstChild);
  var DEMO_V = '2';
  function ver() { try { return localStorage.getItem('cockpit-demo-v'); } catch (e) { return null; } }
  function setVer() { try { localStorage.setItem('cockpit-demo-v', DEMO_V); } catch (e) { /* private window */ } }
  var wait = setInterval(function () {
    if (typeof booted === 'undefined' || !booted) return;
    clearInterval(wait);
    var first = ver() !== DEMO_V;
    if (first && feedSettings().source !== 'binance') { saveFeed({ source: 'binance' }); bfeedSync(); }
    var onlySample = Store.data.accounts.every(function (a) { return a.sample; });
    if (Store.data.accounts.length && !(first && onlySample)) { setVer(); return; }
    // build the made-up trades around today's real prices, once they arrive (or after 6 s, simulated)
    toast('Getting live prices from Binance…', 'accent');
    var started = Date.now();
    var w2 = setInterval(function () {
      if (!bfeedLive('BTC/USDT') && Date.now() - started < 6000) return;
      clearInterval(w2);
      setTimeout(function () {
        if (Store.data.accounts.length) resetData(); else loadSample();
        setVer(); location.hash = '#dashboard';
      }, bfeedLive('BTC/USDT') ? 1500 : 0);
    }, 200);
  }, 100);
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href^="api/"]');
    if (a) { ev.preventDefault(); toast('Downloads work in the installed version, not in this sample.', 'accent'); }
  }, true);
})();
</script>
